<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="选择布丁、乌龟包、包子或鸣门卷，点开蜡皮，再慢慢揉捏柔软的内馅。"><title>蜡皮捏捏 · Cyber Wax Lab</title></head><body><main id="scene" aria-label="可按压的三维蜡皮布丁"></main><header><span class="mark">CW / 01</span><span>CYBER WAX LAB</span><span class="tag">蜡皮捏捏</span></header><section class="panel" aria-label="材料控制"><p class="eyebrow">MATERIAL STUDY</p><h1>先捏碎，再捏软。</h1><p class="intro">点一下冰裂，再点一下碎开。<br>按住拖动，把整块粘土拉长、推拢。</p><label for="thickness">Wax Thickness <output id="thickness-value">0.06</output></label><input id="thickness" type="range" min="0.01" max="0.20" value="0.06" step="0.01"><div class="ends"><span>薄脆</span><span>厚实</span></div><details><summary>手感微调</summary><label for="pudding-softness">内馅柔软度</label><input id="pudding-softness" type="range" min="0.3" max="1.5" step="0.05" value="1.1"><label for="cream-softness">奶油柔软度</label><input id="cream-softness" type="range" min="0.5" max="2" step="0.05" value="1.5"><label for="plasticity">塑形保留</label><input id="plasticity" type="range" min="0.2" max="1" step="0.05" value="0.48"></details><div class="play-actions"><button id="knead">揉成团</button><button id="sound" aria-pressed="true">音效：开</button></div><button id="reset">↺ &nbsp; RESET <span>恢复初始形状</span></button></section><footer><div class="status"><i></i><span id="status" role="status">点一下冰裂，再点一下碎开</span></div><div class="pressure" aria-label="按压力度"><span>PRESSURE</span><meter id="pressure" min="0" max="1" value="0"></meter></div><span class="orbit-hint">空白处拖动 · 旋转查看</span></footer><script type="module" src="/src/main.js"></script></body></html>
